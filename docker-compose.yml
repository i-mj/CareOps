services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: careops
      POSTGRES_USER: careops
      POSTGRES_PASSWORD: careops
    ports: ["5432:5432"]
    volumes: [careops_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  careops_pg:
